apiVersion: apps/v1
kind: Deployment
metadata:
  name: mybelanjawan-docs
spec:
  selector:
    matchLabels:
      app: mybelanjawan-docs
  template:
    metadata:
      labels:
        app: mybelanjawan-docs
    spec:
      containers:
        - name: mybelanjawan-docs
          image: mybelanjawan-docs
          ports:
            - containerPort: 8080
