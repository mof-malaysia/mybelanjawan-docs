apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mybelanjawan-docs
spec:
  ingressClassName: mybelanjawan-nginx
  rules:
    - host: docs.mybelanjawan.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mybelanjawan-docs
                port:
                  number: 8080
