# Content-hashed files (Astro build assets, Pagefind index data) never change: cache forever.
# Everything else (pages, unhashed Pagefind entry/JS/CSS) revalidates on every request.
map $uri $cache_control {
	~^/_astro/                              "public, max-age=31536000, immutable";
	~^/pagefind/(fragment|index)/           "public, max-age=31536000, immutable";
	~^/pagefind/pagefind\.[^/]+\.pf_meta$   "public, max-age=31536000, immutable";
	default                                 "public, max-age=0, must-revalidate";
}

server {
	listen 8080;
	root /usr/share/nginx/html;

	server_tokens off;
	# Behind an ingress: keep redirects relative so they don't point at :8080
	absolute_redirect off;

	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types text/css application/javascript application/json image/svg+xml text/plain;

	error_page 404 /404.html;

	# Liveness/readiness probe
	location = /healthz {
		access_log off;
		default_type text/plain;
		return 200 "ok\n";
	}

	# /docs/rumusan -> /docs/rumusan/index.html
	location / {
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Cache-Control $cache_control;
		try_files $uri $uri/index.html $uri.html =404;
	}
}
